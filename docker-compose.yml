version: '3.8'

services:
  # 1. Cơ sở dữ liệu NoSQL MongoDB
  techstore-mongodb:
    image: mongo:6.0
    container_name: techstore-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # 2. Backend REST API (Node.js & Express & Mongoose)
  techstore-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://techstore-mongodb:27017/techstore
    depends_on:
      - techstore-mongodb
    restart: always

  # 3. Frontend Web Client (React 18 & Nginx)
  techstore-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techstore-frontend
    ports:
      - "80:3000"
    depends_on:
      - techstore-backend
    restart: always

volumes:
  mongo-data:
    name: techstore-mongo-data

networks:
  default:
    name: techstore-network
