name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Đăng nhập vào Docker Hub qua GitHub Secrets
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 4: Build Docker image với tag latest và commit SHA
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:${{ github.sha }} .

      # Bước 5: Push Docker image lên Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:${{ github.sha }}

      # Bước 6: Cleanup (logout Docker Hub)
      - name: Cleanup
        if: always()
        run: |
          docker logout
