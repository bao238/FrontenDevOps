name: CI/CD - Build, Push & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Đăng nhập vào Docker Hub qua GitHub Secrets
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 4: Build Docker image với tag latest và commit SHA
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:${{ github.sha }} .

      # Bước 5: Push Docker image lên Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vtabs_socibot_front_end:${{ github.sha }}

      # Bước 6: Tự động SSH vào AWS EC2 và triển khai cập nhật
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FrontenDevOps
            git checkout -- .
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
