version: '3.8'

services:
  # 1. Cơ sở dữ liệu NoSQL MongoDB
  bookstore-mongodb:
    image: mongo:6.0
    container_name: bookstore-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # 2. Backend REST API (Node.js & Express & Mongoose)
  bookstore-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstore-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://bookstore-mongodb:27017/bookstore
    depends_on:
      - bookstore-mongodb
    restart: always

  # 3. Frontend Web Client (React 18 & Nginx)
  bookstore-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-frontend
    ports:
      - "80:3000"
    depends_on:
      - bookstore-backend
    restart: always

volumes:
  mongo-data:
    name: bookstore-mongo-data

networks:
  default:
    name: bookstore-network
